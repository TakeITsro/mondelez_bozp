<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Mondelēz BOZP">
    <!-- Mondelēz purple background. Full-bleed so it works as a maskable icon. -->
    <rect width="512" height="512" fill="#4F2170"/>
    <!-- Inner safe-area (80% of 512 = 410, centred) keeps content inside maskable bounds. -->
    <g transform="translate(256 256)">
        <text
            text-anchor="middle"
            dominant-baseline="central"
            font-family="Arial, Helvetica, sans-serif"
            font-weight="700"
            font-size="160"
            fill="#FEFFFD"
            letter-spacing="6"
        >BOZP</text>
        <text
            text-anchor="middle"
            dominant-baseline="central"
            font-family="Arial, Helvetica, sans-serif"
            font-weight="400"
            font-size="40"
            fill="#FEFFFD"
            y="100"
            opacity="0.85"
        >MONDELĒZ</text>
    </g>
</svg>
